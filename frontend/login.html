<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Countdown</title>

    <link
        rel="stylesheet"
        href="/static/login.css"
    >

</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-header">

                <h1>Countdown</h1>

                <p>
                    Entre na sua conta
                </p>

            </div>


            <form id="login-form">

                <div class="input-group">

                    <label for="username">
                        Usuário
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Digite seu usuário"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Entrar
                </button>

            </form>


            <p
                id="mensagem"
                class="mensagem"
            ></p>


            <div class="login-footer">

                <p>
                    Ainda não possui uma conta?
                </p>

                <a href="/static/registro.html">
                    Criar conta
                </a>

            </div>

        </div>

    </div>


    <script src="/static/login.js"></script>

</body>

</html>
